# Configuration applicative NON sensible (versionnée dans Git).
# Les secrets (tokens) ne vont JAMAIS ici : voir .env.example.

app_name: chsa-triage
environment: dev

model:
  base_model_id: Qwen/Qwen3-1.7B-Base
  max_seq_length: 2048
  seed: 42

data:
  languages: [fr, en]
  sft_target_pairs: 5000
  raw_dir: data/raw
  processed_dir: data/processed

audit:
  log_path: logs/audit/audit_log.jsonl
  enabled: true
